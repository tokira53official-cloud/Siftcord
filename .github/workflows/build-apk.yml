name: Build SiftCord APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set Up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract SiftCord Project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: SiftCord ZIP not found!"
            exit 1
          fi

          mkdir -p project
          unzip -o "$ZIP_FILE" -d project

      - name: Locate Android Project
        run: |
          SETTINGS=$(find project -type f -name "settings.gradle" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project location: $PROJECT_DIR"
          cat "$SETTINGS"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build SiftCord APK
        run: |
          cd "$PROJECT_DIR"
          gradle --version
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk"

      - name: Upload SiftCord APK
        uses: actions/upload-artifact@v4
        with:
          name: SiftCord-APK
          path: project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
