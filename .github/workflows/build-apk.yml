name: Build Siftcord APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract Siftcord ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p project
          unzip -o Siftcord_GitHub_Starter.zip -d project
          echo "Extracted project files:"
          find project -maxdepth 5 -type f | head -100

      - name: Locate Android project
        run: |
          find project -name settings.gradle -o -name settings.gradle.kts

      - name: Build Siftcord APK
        run: |
          cd project
          gradle assembleDebug --stacktrace

      - name: Upload Siftcord APK
        uses: actions/upload-artifact@v4
        with:
          name: Siftcord-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
